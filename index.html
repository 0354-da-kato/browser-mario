<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブラウザマリオ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍄 ブラウザマリオ 🍄</h1>
            <div class="stats">
                <div>スコア: <span id="score">0</span></div>
                <div>コイン: <span id="coins">0</span>/10</div>
                <div>ステージ: <span id="stage">1-1</span></div>
            </div>
        </div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div class="controls">
            <p>操作: ← → キーで移動 | スペースキーでジャンプ | 敵を上から踏む</p>
            <button id="restartBtn">ゲーム再スタート</button>
        </div>
        <!-- ゲームオーバー画面 -->
        <div id="gameOverScreen" class="game-screen hidden">
            <div class="modal game-over-modal">
                <h2 class="modal-title">💀 ゲームオーバー 💀</h2>
                <p id="gameOverMessage" class="modal-message">ゲームオーバーです</p>
                <div class="score-display">
                    <p>スコア: <span id="gameOverScore">0</span></p>
                </div>
                <button id="gameOverRetryBtn" class="modal-button retry-button">もう一度プレイ</button>
            </div>
        </div>

        <!-- クリア画面 -->
        <div id="clearScreen" class="game-screen hidden">
            <div class="modal clear-modal">
                <h2 class="modal-title">🎉 クリア! 🎉</h2>
                <p class="modal-message">ステージをクリアしました!</p>
                <div class="score-display">
                    <p>スコア: <span id="clearScore">0</span></p>
                    <p>集めたコイン: <span id="clearCoins">0</span>/10</p>
                </div>
                <button id="clearRetryBtn" class="modal-button clear-button">次のステージへ</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
