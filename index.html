<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブラウザマリオ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍄 ブラウザマリオ 🍄</h1>
            <div class="stats">
                <div>スコア: <span id="score">0</span></div>
                <div>コイン: <span id="coins">0</span>/10</div>
                <div>ステージ: <span id="stage">1-1</span></div>
            </div>
        </div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div class="controls">
            <p>操作: ← → キーで移動 | スペースキーでジャンプ</p>
            <button id="restartBtn">ゲーム再スタート</button>
        </div>
        <div id="gameOverScreen" class="game-over-screen hidden">
            <div class="modal">
                <h2 id="gameOverTitle">ゲームオーバー</h2>
                <p id="gameOverMessage">ゲームオーバーです</p>
                <button id="retryBtn">もう一度プレイ</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
